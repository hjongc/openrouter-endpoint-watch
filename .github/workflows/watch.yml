name: OpenRouter endpoint watch

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: oewatch
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install .
      - name: Snapshot endpoints
        id: snap
        run: oewatch snapshot
      - run: oewatch history --out HISTORY.md
        if: steps.snap.outputs.changed == 'true'
      - run: PYTHONPATH=src python scripts/render_figures.py
        if: steps.snap.outputs.changed == 'true'
      - name: Commit snapshots and history
        if: steps.snap.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots HISTORY.md docs/assets
          git diff --cached --quiet || git commit -m "Update OpenRouter endpoint history"
          git push
      - name: Check for breaking endpoint changes
        id: diff
        if: steps.snap.outputs.changed == 'true'
        run: |
          set -o pipefail
          set +e
          oewatch diff --format md --fail-on quantization_changed,endpoint_removed,endpoint_replaced,profile_eligible_changed,pinned_dropped > endpoint-diff.md
          result=$?
          set -e
          cat endpoint-diff.md
          if [ "$result" -eq 2 ]; then
            echo "breaking=true" >> "$GITHUB_OUTPUT"
          elif [ "$result" -ne 0 ]; then
            exit "$result"
          fi
      - name: Open issue for endpoint changes
        if: steps.snap.outputs.changed == 'true' && steps.diff.outputs.breaking == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "OpenRouter endpoint changes detected" --body-file endpoint-diff.md || true
      - name: Record unchanged poll
        if: steps.snap.outputs.changed != 'true'
        run: echo "No change at $(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_STEP_SUMMARY"
